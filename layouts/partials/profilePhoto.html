<div
  class="w-full p-2 flex justify-center align-middle profile-photo-container"
>
  {{ $data := .Site.Data }}
  {{ $localized := index .Site.Data .Site.Language.Lang }}
  {{ if $localized }}{{ $data = $localized }}{{ end }}
  <img
    class="rounded-sm"
    src="{{ `images` | relURL }}/{{ $data.profile.photo }}"
    alt="{{ $data.profile.name }}"
  />
</div>
