{{ if .Site.Data.skills.topics }}
<div class="pl-0">
  {{ range .Site.Data.skills.topics }}
  <p class="mb-1 font-semibold">• {{ .title }}</p>
  {{ range .items }}
  <p class="mb-1 ms-4">{{ . }}</p>
  {{ end }}
  <div class="mb-3"></div>
  {{ end }}
</div>
{{ else }}
<div class="pl-0">{{- range sort .Site.Data.skills.list "skill" -}}
  <p class="mb-2">• {{ .skill }}</p>{{- end -}}
</div>
{{ end }}
