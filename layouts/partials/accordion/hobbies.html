{{ $data := .Site.Data }}
{{ $localized := index .Site.Data .Site.Language.Lang }}
{{ if $localized }}{{ $data = $localized }}{{ end }}
{{ if $data.hobbies.description }}
<p class="mb-3">
  {{ $data.hobbies.description | markdownify }}
</p>
{{ end }}
<ul class="pl-0">
  {{ range $data.hobbies.list }}
  <li class="list-unstyled mb-2">{{ .hobby }}</li>
  {{ end }}
</ul>
